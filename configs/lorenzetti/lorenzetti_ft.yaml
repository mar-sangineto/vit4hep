exp_type: lorenzetti_ft_cfm
exp_name: Lorenzetti_fromCaloGAN
dtype: float32

model_type: shape
sample_us: false
n_samples: 100000
data:
  training_file: /eos/user/m/msangine/data/lorenzetti/h5/train_40kElectron.h5
  test_file: /eos/user/m/msangine/data/lorenzetti/h5/test_40kElectron.h5
  bin_edges: [0, 2048, 3072, 4352, 4792, 5208, 5464, 5496, 5528, 5560, 5816, 6072, 6136, 6200, 6240, 6272, 6304, 6320]
  return_us: false
  transforms: {
    LorenzettiNormalizeLayerEnergy: {},
    LorenzettiExclusiveLogitTransform: {delta: 1.0e-6, rescale: False},
    LorenzettiGlobalStandardizeFromFile: {model_dir: None},
    LorenzettiLogEnergy: {},
    LorenzettiScaleEnergy: {e_min: 6.907755, e_max: 13.815510},
  }
  
finetuning:
  backbone_cfg: /eos/user/m/msangine/lpnhe_workspace/vit4hep/runs/CaloGAN/calogan_44009/config_0.yaml
  backbone_lr: 1.e-4
  head_lr: 5.e-4
  embedder_lr: 5.e-4
  map_x_embedding: false
  map_c_embedding: false
  reinitialize_x_embedding: false
  reinitialize_c_embedding: false
  reinitialize_pos_embedding: true
  reinitialize_final_layer: true
  interpolate: true
load_sample: false
evaluation:
  eval_dataset: "Lorenzetti"
  eval_mode: "low-level"
  eval_hdf5_file: /eos/user/m/msangine/data/lorenzetti/h5/40kElectron.h5
  eval_cls_n_layer: 2
  eval_cls_n_hidden: 2048
  eval_cls_dropout: 0.0
  eval_cls_lr: 2.e-4
  eval_cls_batch_size: 1000
  eval_cls_n_epochs: 100
  eval_cls_save_mem: True

defaults:
 - /default
 - /training: default
 - /model: cfm_lorenzetti/cfm_lorenzetti
