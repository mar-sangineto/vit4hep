exp_type: lorenzetti
exp_name: Lorenzetti_L3_energy_range_e100to150
dtype: float32

model_type: energy
sample_us: False
n_samples: 100000
data:
  n_layers: 3
  training_file: /eos/user/m/msangine/data/lorenzetti/h5/energy_range_study/train_e100to150.h5
  test_file: /eos/user/m/msangine/data/lorenzetti/h5/energy_range_study/test_e100to150.h5
  bin_edges: [0, 2048, 3072, 4352]
  return_us: true
  transforms: {
    LorenzettiClipNegativeCells: {n_layers: "${data.n_layers}"},
    LorenzettiNormalizeLayerEnergy: {n_layers: "${data.n_layers}"},
    LorenzettiExclusiveLogitTransform: {delta: 1.0e-6, rescale: False, n_layers: "${data.n_layers}"},
    LorenzettiGlobalStandardizeFromFile: {model_dir: None, n_layers: "${data.n_layers}"},
    LorenzettiLogEnergy: {},
    LorenzettiScaleEnergyFromFile: {model_dir: None},
  }
finetuning: false
load_sample: false
evaluation:
  eval_dataset: "Lorenzetti"
  eval_mode: "energy-ratios"
  eval_cls_n_layer: 2
  eval_cls_n_hidden: 512
  eval_cls_dropout: 0.0
  eval_cls_lr: 2.e-4
  eval_cls_batch_size: 1000
  eval_cls_n_epochs: 100
  eval_cls_save_mem: True

defaults:
 - /default
 - _self_
 - /training: cfm/energy
 - /model: cfm_lorenzetti/cfm_lorenzetti_energy
