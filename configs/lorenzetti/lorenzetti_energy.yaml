exp_type: lorenzetti
exp_name: Lorenzetti
dtype: float32

model_type: energy
sample_us: False
n_samples: 100000
data:
  training_file: /eos/user/m/msangine/data/lorenzetti/h5/train_fixed45kElectron.h5
  test_file: /eos/user/m/msangine/data/lorenzetti/h5/test_fixed45kElectron.h5
  bin_edges: [0, 2048, 3072, 4352, 4792, 5208, 5464, 5496, 5528, 5560, 5816, 6072, 6136, 6200, 6240, 6272, 6304, 6320]
  return_us: true
  transforms: {
    LorenzettiNormalizeLayerEnergy: {},
    LorenzettiExclusiveLogitTransform: {delta: 1.0e-6, rescale: False},
    LorenzettiGlobalStandardizeFromFile: {model_dir: None},
    LorenzettiLogEnergy: {},
    LorenzettiScaleEnergy: {e_min: 6.907755, e_max: 13.815510},
  }
finetuning: false
load_sample: false
evaluation:
  eval_dataset: "Lorenzetti"
  eval_mode: "energy-ratios"
  eval_cls_n_layer: 2
  eval_cls_n_hidden: 512
  eval_cls_dropout: 0.0
  eval_cls_lr: 2.e-4
  eval_cls_batch_size: 1000
  eval_cls_n_epochs: 100
  eval_cls_save_mem: True

defaults:
 - /default
 - /training: cfm/energy
 - /model: cfm_lorenzetti/cfm_lorenzetti_energy
 - _self_