exp_type: lorenzetti_ft_cfm
exp_name: Lorenzetti_fromCaloGAN
dtype: float32

model_type: shape
sample_us: false
n_samples: 100000
data:
  n_layers: 17
  training_file: /eos/user/m/msangine/data/lorenzetti/h5/joined_faster/train_fixed_eta03_phi03_L3.h5
  test_file: /eos/user/m/msangine/data/lorenzetti/h5/joined_faster/test_fixed_eta03_phi03_L3.h5
  return_us: false
  transforms: {
    LorenzettiNormalizeLayerEnergy: {n_layers: "${data.n_layers}"},
    LorenzettiExclusiveLogitTransform: {delta: 1.0e-6, rescale: False, n_layers: "${data.n_layers}"},
    LorenzettiGlobalStandardizeFromFile: {model_dir: None, n_layers: "${data.n_layers}"},
    LorenzettiLogEnergy: {},
    LorenzettiScaleEnergy: {e_min: 6.907755, e_max: 13.815510},
  }
  
finetuning:
  backbone_cfg: /eos/user/m/msangine/lpnhe_workspace/vit4hep/runs/CaloGAN/calogan_44009/config_0.yaml
  backbone_lr: 1.e-4
  head_lr: 5.e-4
  embedder_lr: 5.e-4
  map_x_embedding: false
  map_c_embedding: false
  reinitialize_x_embedding: false
  reinitialize_c_embedding: false
  reinitialize_pos_embedding: true
  reinitialize_final_layer: true
  interpolate: true
load_sample: false
evaluation:
  eval_dataset: "Lorenzetti"
  eval_mode: "low-level"
  eval_hdf5_file: /eos/user/m/msangine/data/lorenzetti/h5/joined_faster/fixed_eta03_phi03_L3.h5
  eval_cls_n_layer: 2
  eval_cls_n_hidden: 2048
  eval_cls_dropout: 0.0
  eval_cls_lr: 2.e-4
  eval_cls_batch_size: 1000
  eval_cls_n_epochs: 100
  eval_cls_save_mem: True

defaults:
 - /default
 - /training: default
 - /model: cfm_lorenzetti/cfm_lorenzetti_l3
 - _self_
