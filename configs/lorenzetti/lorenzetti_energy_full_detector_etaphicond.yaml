exp_type: lorenzetti
exp_name: Lorenzetti_L3_energy_full_detector_etaphicond
dtype: float32

model_type: energy
sample_us: False
n_samples: 100000
data:
  n_layers: 3
  training_file: /eos/user/m/msangine/data/lorenzetti/h5/joined_faster/train_full_detector_L3_223271events.h5
  test_file: /eos/user/m/msangine/data/lorenzetti/h5/joined_faster/test_full_detector_L3_55818events.h5
  bin_edges: [0, 2048, 3072, 4352]
  return_us: true
  use_eta_phi_condition: true  # append per-event (eta, phi) to the conditioning vector (energy, eta, phi) -- see datasets.py/experiment.py::sample_n(); requires model: cfm_lorenzetti_energy_etaphi (dims_c=3)
  transforms: {
    LorenzettiClipNegativeCells: {n_layers: "${data.n_layers}"},
    LorenzettiNormalizeLayerEnergy: {n_layers: "${data.n_layers}"},
    LorenzettiExclusiveLogitTransform: {delta: 1.0e-6, rescale: False, n_layers: "${data.n_layers}"},
    LorenzettiGlobalStandardizeFromFile: {model_dir: None, n_layers: "${data.n_layers}"},
    LorenzettiLogEnergy: {},
    LorenzettiScaleEnergyFromFile: {model_dir: None},
  }
finetuning: false
load_sample: false
evaluation:
  eval_dataset: "Lorenzetti"
  eval_mode: "energy-ratios"
  eval_cls_n_layer: 2
  eval_cls_n_hidden: 512
  eval_cls_dropout: 0.0
  eval_cls_lr: 2.e-4
  eval_cls_batch_size: 1000
  eval_cls_n_epochs: 100
  eval_cls_save_mem: True

defaults:
 - /default
 - _self_
 - /training: cfm/energy
 - /model: cfm_lorenzetti/cfm_lorenzetti_energy_etaphi
